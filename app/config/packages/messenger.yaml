framework:
    messenger:
        failure_transport: failed
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    group: symfony
                    consumer: '%env(MESSENGER_CONSUMER_NAME)%'
                    delete_after_ack: true
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
            failed:
                dsn: '%env(REDIS_URL)%/failed'
            sync: 'sync://'
        routing:
            'App\Message\*': async
