security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)/
            security: false
        main:
            lazy: true
            provider: app_users
            custom_authenticators:
                - App\Security\ApiAuthenticator
            entry_point: App\Security\ApiAuthenticator
            access_denied_handler: App\Security\ApiAuthenticator
            logout:
                path: api_logout
                enable_csrf: true

    access_control:
        - { path: ^/api/(login|csrf)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin(?:/|$), roles: ROLE_ADMIN }
        - { path: ^/api(?:/|$), roles: ROLE_USER }
